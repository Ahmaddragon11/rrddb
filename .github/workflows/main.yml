name: AHMAD DRAGON - Multi-OS RDP & Web Control Center

on:
  workflow_dispatch:
    inputs:
      os_version:
        description: 'Select Operating System & Version (اختر النظام والإصدار)'
        required: true
        default: 'windows-2025'
        type: choice
        options:
          - windows-2025
          - windows-2022
          - windows-2019
          - ubuntu-24.04
          - ubuntu-22.04
          - macos-15
      password_mode:
        description: 'Password Mode (طريقة إنشاء أو اختيار كلمة المرور داخلياً)'
        required: true
        default: 'custom_input'
        type: choice
        options:
          - auto_generate
          - custom_input
          - github_secret
      custom_password:
        description: 'Custom Password (اكتب كلمة المرور هنا إذا اخترت custom_input - 12 حرف فأكثر)'
        required: false
        default: ''
        type: string
      rdp_username:
        description: 'Administrator Username (اسم مستخدم السيرفر)'
        required: true
        default: 'RDP'
        type: string
      session_minutes:
        description: 'Active Duration in Minutes (مدة بقاء السيرفر شغال بالدقائق)'
        required: true
        default: '350'
        type: choice
        options:
          - '350'
          - '300'
          - '240'
          - '180'
          - '120'
          - '60'
      enable_web_panel:
        description: 'Launch AHMAD DRAGON Web Control Panel on Port 8080 (تشغيل موقع التحكم السريع)'
        required: false
        default: true
        type: boolean
      enable_audio_boost:
        description: 'Enable RDP Audio, Dark Mode & Performance Boost (تفعيل الصوت والوضع الليلي)'
        required: false
        default: true
        type: boolean
      install_tools:
        description: 'Install Essential Tools & Desktop Shortcuts (تثبيت الأدوات الأساسية)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  ahmad-dragon-rdp:
    name: AHMAD DRAGON // ${{ inputs.os_version || 'windows-2025' }}
    runs-on: ${{ inputs.os_version || 'windows-2025' }}
    timeout-minutes: 350

    steps:
      # =========================================================================
      # 1. VALIDATE CONFIGURATION & INTERNAL PASSWORD GENERATOR ENGINE
      # =========================================================================
      - name: 1. Initialize & Internal Password Manager
        shell: pwsh
        env:
          SECRET_RDP_PASS: ${{ secrets.RDP_PASSWORD }}
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
          INPUT_PASS_MODE: ${{ inputs.password_mode }}
          INPUT_CUSTOM_PASS: ${{ inputs.custom_password }}
          INPUT_USER: ${{ inputs.rdp_username }}
        run: |
          Write-Host "========================================================" -ForegroundColor Cyan
          Write-Host "   AHMAD DRAGON // MULTI-OS RDP & WEB COMMAND ENGINE    " -ForegroundColor Cyan
          Write-Host "========================================================" -ForegroundColor Cyan

          if ([string]::IsNullOrWhiteSpace($env:TAILSCALE_AUTHKEY)) {
            throw "Missing TAILSCALE_AUTHKEY secret! Please add TAILSCALE_AUTHKEY in Repository Settings -> Secrets."
          }

          $username = if ([string]::IsNullOrWhiteSpace($env:INPUT_USER)) { "RDP" } else { $env:INPUT_USER.Trim() }
          $mode = if ([string]::IsNullOrWhiteSpace($env:INPUT_PASS_MODE)) { "custom_input" } else { $env:INPUT_PASS_MODE }
          $finalPass = ""
          $passSource = ""

          function New-DragonPassword {
            $upper = "ABCDEFGHJKLMNPQRSTUVWXYZ".ToCharArray()
            $lower = "abcdefghijkmnopqrstuvwxyz".ToCharArray()
            $digits = "23456789".ToCharArray()
            $symbols = "!@#$%^*_-+=".ToCharArray()
            $all = $upper + $lower + $digits + $symbols
            $chars = @(
              ($upper | Get-Random -Count 3) +
              ($lower | Get-Random -Count 5) +
              ($digits | Get-Random -Count 4) +
              ($symbols | Get-Random -Count 3)
            )
            $shuffled = ($chars | Sort-Object { Get-Random }) -join ''
            return "Drg#" + $shuffled
          }

          if ($mode -eq "custom_input") {
            if ([string]::IsNullOrWhiteSpace($env:INPUT_CUSTOM_PASS)) {
              Write-Warning "custom_input selected but field was empty. Auto-generating secure password instead..."
              $finalPass = New-DragonPassword
              $passSource = "Auto-Generated (Fallback)"
            } elseif ($env:INPUT_CUSTOM_PASS.Length -lt 12) {
              throw "Custom password must contain at least 12 characters (with uppercase, lowercase, and numbers)."
            } else {
              $finalPass = $env:INPUT_CUSTOM_PASS
              $passSource = "Custom Workflow Input"
            }
          } elseif ($mode -eq "github_secret") {
            if ([string]::IsNullOrWhiteSpace($env:SECRET_RDP_PASS)) {
              Write-Warning "RDP_PASSWORD secret not found. Auto-generating internal password so workflow succeeds..."
              $finalPass = New-DragonPassword
              $passSource = "Auto-Generated (Secret Fallback)"
            } elseif ($env:SECRET_RDP_PASS.Length -lt 12) {
              throw "RDP_PASSWORD secret must contain at least 12 characters."
            } else {
              $finalPass = $env:SECRET_RDP_PASS
              $passSource = "GitHub Secret (RDP_PASSWORD)"
            }
          } else {
            $finalPass = New-DragonPassword
            $passSource = "Internal Auto-Generator"
          }

          "DRAGON_USER=$username" >> $env:GITHUB_ENV
          "DRAGON_PASS=$finalPass" >> $env:GITHUB_ENV
          "DRAGON_PASS_SOURCE=$passSource" >> $env:GITHUB_ENV
          "DRAGON_RDP_PORT=3389" >> $env:GITHUB_ENV
          "DRAGON_WEB_PORT=8080" >> $env:GITHUB_ENV
          "DRAGON_START_UTC=$((Get-Date).ToUniversalTime().ToString('o'))" >> $env:GITHUB_ENV

          Write-Host "[OK] Target Username : $username" -ForegroundColor Green
          Write-Host "[OK] Password Source : $passSource" -ForegroundColor Green

      # =========================================================================
      # 2. DEEP SYSTEM HARDWARE, STORAGE & NETWORK DIAGNOSTICS
      # =========================================================================
      - name: 2. Deep System & Hardware Telemetry
        shell: pwsh
        run: |
          $telemetry = [ordered]@{
            RunnerOS = $env:RUNNER_OS
            RunnerArch = $env:RUNNER_ARCH
            SelectedImage = "${{ inputs.os_version || 'windows-2025' }}"
            Hostname = [System.Net.Dns]::GetHostName()
            Timestamp = (Get-Date).ToString("yyyy-MM-dd HH:mm:ss UTC")
          }

          if ($IsWindows) {
            $os = Get-CimInstance Win32_OperatingSystem
            $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
            $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'"
            $telemetry.OSCaption = $os.Caption
            $telemetry.OSBuild = $os.BuildNumber
            $telemetry.CPUName = $cpu.Name.Trim()
            $telemetry.CPUCores = $cpu.NumberOfLogicalProcessors
            $telemetry.RAMTotalGB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
            $telemetry.RAMFreeGB = [math]::Round($os.FreePhysicalMemory / 1MB, 2)
            $telemetry.DiskTotalGB = [math]::Round($disk.Size / 1GB, 2)
            $telemetry.DiskFreeGB = [math]::Round($disk.FreeSpace / 1GB, 2)
          } elseif ($IsLinux) {
            $telemetry.OSCaption = (lsb_release -ds 2>$null) -join ""
            $telemetry.OSBuild = (uname -r) -join ""
            $telemetry.CPUName = ((grep -m 1 "model name" /proc/cpuinfo) -replace ".*: ","").Trim()
            $telemetry.CPUCores = (nproc) -join ""
            $memTotalKb = [double](((grep MemTotal /proc/meminfo) -replace "[^0-9]",""))
            $memAvailKb = [double](((grep MemAvailable /proc/meminfo) -replace "[^0-9]",""))
            $telemetry.RAMTotalGB = [math]::Round($memTotalKb / 1048576, 2)
            $telemetry.RAMFreeGB = [math]::Round($memAvailKb / 1048576, 2)
            $df = (df -BG / | Select-Object -Last 1) -split 's+'
            $telemetry.DiskTotalGB = ($df[1] -replace "G","")
            $telemetry.DiskFreeGB = ($df[3] -replace "G","")
          } else {
            $telemetry.OSCaption = (sw_vers -productName) + " " + (sw_vers -productVersion)
            $telemetry.OSBuild = (sw_vers -buildVersion)
            $telemetry.CPUName = (sysctl -n machdep.cpu.brand_string 2>$null)
            $telemetry.CPUCores = (sysctl -n hw.ncpu)
            $telemetry.RAMTotalGB = [math]::Round([double](sysctl -n hw.memsize) / 1GB, 2)
            $telemetry.RAMFreeGB = 8.0
            $telemetry.DiskTotalGB = 140
            $telemetry.DiskFreeGB = 90
          }

          $jsonPath = Join-Path ([System.IO.Path]::GetTempPath()) "dragon-telemetry.json"
          $telemetry | ConvertTo-Json -Depth 4 | Set-Content -Path $jsonPath -Encoding UTF8
          "DRAGON_TELEMETRY_FILE=$jsonPath" >> $env:GITHUB_ENV

          Write-Host "========================================================" -ForegroundColor Yellow
          Write-Host "           AHMAD DRAGON HARDWARE SPECIFICATIONS         " -ForegroundColor Yellow
          Write-Host "========================================================" -ForegroundColor Yellow
          Write-Host "OS Edition  : $($telemetry.OSCaption) (Build $($telemetry.OSBuild))"
          Write-Host "Processor   : $($telemetry.CPUName) ($($telemetry.CPUCores) vCPUs)"
          Write-Host "Memory      : $($telemetry.RAMFreeGB) GB Free / $($telemetry.RAMTotalGB) GB Total"
          Write-Host "NVMe Disk   : $($telemetry.DiskFreeGB) GB Free / $($telemetry.DiskTotalGB) GB Total"
          Write-Host "========================================================" -ForegroundColor Yellow

      # =========================================================================
      # 3A. CONFIGURE REMOTE DESKTOP & OPTIMIZATIONS (WINDOWS SERVER 2019/2022/2025)
      # =========================================================================
      - name: 3A. Configure Windows Remote Desktop & Tuning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Enable RDP & NLA Security Layer
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' -Name 'UserAuthentication' -Value 1
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' -Name 'SecurityLayer' -Value 2
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' -Name 'MaxMonitors' -Value 4
          Set-ItemProperty -Path 'HKLM:SystemCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' -Name 'ColorDepth' -Value 4

          # Create or Update RDP Administrator Account
          $securePass = ConvertTo-SecureString $env:DRAGON_PASS -AsPlainText -Force
          if (Get-LocalUser -Name $env:DRAGON_USER -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name $env:DRAGON_USER -Password $securePass -PasswordNeverExpires $true
            Enable-LocalUser -Name $env:DRAGON_USER
          } else {
            New-LocalUser -Name $env:DRAGON_USER -Password $securePass -Description 'AHMAD DRAGON Remote Admin' -AccountNeverExpires -PasswordNeverExpires
          }

          foreach ($grp in @('Administrators', 'Remote Desktop Users')) {
            $isMember = Get-LocalGroupMember -Group $grp -ErrorAction SilentlyContinue | Where-Object { $_.Name -match "\\$($env:DRAGON_USER)$" }
            if (-not $isMember) {
              Add-LocalGroupMember -Group $grp -Member $env:DRAGON_USER -ErrorAction SilentlyContinue
            }
          }

          # Audio, Dark Theme & High-Performance Tuning
          if ("${{ inputs.enable_audio_boost }}" -eq "true") {
            Write-Host "[+] Enabling Windows Audio Redirection & Dark Mode..." -ForegroundColor Cyan
            Set-Service -Name 'Audiosrv' -StartupType Automatic -ErrorAction SilentlyContinue
            Start-Service -Name 'Audiosrv' -ErrorAction SilentlyContinue
            Set-ItemProperty -Path 'HKLM:SYSTEMCurrentControlSetControlTerminal ServerWinStationsRDP-Tcp' -Name 'fDisableAudioCapture' -Value 0 -ErrorAction SilentlyContinue
            New-Item -Path 'HKCU:SOFTWAREMicrosoftWindowsCurrentVersionThemesPersonalize' -Force | Out-Null
            Set-ItemProperty -Path 'HKCU:SOFTWAREMicrosoftWindowsCurrentVersionThemesPersonalize' -Name 'AppsUseLightTheme' -Value 0 -ErrorAction SilentlyContinue
            Set-ItemProperty -Path 'HKCU:SOFTWAREMicrosoftWindowsCurrentVersionThemesPersonalize' -Name 'SystemUsesLightTheme' -Value 0 -ErrorAction SilentlyContinue
            powercfg /setactive 8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c 2>$null
          }

          # Configure Tailscale-Scoped Firewall Rules for RDP (3389) & Web Control Panel (8080)
          Get-NetFirewallRule -DisplayName 'AHMAD DRAGON*' -ErrorAction SilentlyContinue | Remove-NetFirewallRule
          New-NetFirewallRule -DisplayName 'AHMAD DRAGON RDP' -Direction Inbound -Protocol TCP -LocalPort 3389 -RemoteAddress '100.64.0.0/10' -Action Allow -Profile Any | Out-Null
          New-NetFirewallRule -DisplayName 'AHMAD DRAGON WEB PANEL' -Direction Inbound -Protocol TCP -LocalPort 8080 -RemoteAddress '100.64.0.0/10' -Action Allow -Profile Any | Out-Null

          Set-Service TermService -StartupType Automatic
          Restart-Service TermService -Force

      # =========================================================================
      # 3B. CONFIGURE LINUX XRDP + XFCE4 DESKTOP (UBUNTU 22.04 / 24.04)
      # =========================================================================
      - name: 3B. Configure Linux XFCE4 Desktop & XRDP Server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 x11-xserver-utils

          if ! id "$DRAGON_USER" &>/dev/null; then
            sudo useradd -m -s /bin/bash "$DRAGON_USER"
          fi
          echo "$DRAGON_USER:$DRAGON_PASS" | sudo chpasswd
          sudo usermod -aG sudo,ssl-cert "$DRAGON_USER"
          echo "xfce4-session" | sudo tee /home/$DRAGON_USER/.xsession
          sudo chown $DRAGON_USER:$DRAGON_USER /home/$DRAGON_USER/.xsession

          sudo sed -i 's/3389/3389/g' /etc/xrdp/xrdp.ini
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp

      # =========================================================================
      # 4. INSTALL & CONNECT TAILSCALE MESH NETWORK
      # =========================================================================
      - name: 4. Connect Tailscale Secure Mesh VPN
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          $nodeHostname = "ahmad-dragon-$($env:RUNNER_OS.ToLower())-$env:GITHUB_RUN_ID"

          if ($IsWindows) {
            $installer = "$env:TEMP	ailscale.msi"
            Invoke-WebRequest 'https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi' -OutFile $installer
            $proc = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart" -Wait -PassThru
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
            if ($proc.ExitCode -notin @(0, 3010)) { throw "Tailscale MSI installation failed" }
            $ts = "$env:ProgramFilesTailscale	ailscale.exe"
          } else {
            curl -fsSL https://tailscale.com/install.sh | sh
            $ts = "tailscale"
          }

          if ($IsWindows) {
            & $ts up "--authkey=$env:TAILSCALE_AUTHKEY" "--hostname=$nodeHostname" --accept-routes
          } else {
            sudo $ts up "--authkey=$env:TAILSCALE_AUTHKEY" "--hostname=$nodeHostname"
          }

          $ip = $null
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            $res = & $ts ip -4 2>$null
            if ($res -match '^100.') {
              $ip = ($res | Select-Object -First 1).Trim()
              break
            }
          }

          if (-not $ip) { throw "Failed to acquire Tailscale 100.x.y.z IPv4 address" }
          "TAILSCALE_IP=$ip" >> $env:GITHUB_ENV
          "TAILSCALE_HOSTNAME=$nodeHostname" >> $env:GITHUB_ENV
          Write-Host "[OK] Tailscale Connected! Mesh IP: $ip ($nodeHostname)" -ForegroundColor Green

      # =========================================================================
      # 5. LAUNCH EMBEDDED AHMAD DRAGON WEB CONTROL PANEL (HTTP PORT 8080)
      # =========================================================================
      - name: 5. Start Embedded AHMAD DRAGON Web Control Panel
        if: inputs.enable_web_panel == true
        shell: pwsh
        run: |
          $webScript = @'
          param($Port, $Ip, $User, $Pass, $RdpPort, $OsLabel, $MaxMinutes)
          $stopFlag = Join-Path ([System.IO.Path]::GetTempPath()) "dragon-stop.signal"
          $passFile = Join-Path ([System.IO.Path]::GetTempPath()) "dragon-current-pass.txt"
          Set-Content -Path $passFile -Value $Pass -Encoding UTF8
          $startTime = Get-Date

          $listener = New-Object System.Net.HttpListener
          $listener.Prefixes.Add("http://+:$Port/")
          $listener.Start()

          while ($listener.IsListening) {
            $ctx = $listener.GetContext()
            $req = $ctx.Request
            $res = $ctx.Response
            $path = $req.Url.AbsolutePath

            $currentPass = (Get-Content $passFile -Raw).Trim()
            $elapsedMin = [math]::Round(((Get-Date) - $startTime).TotalMinutes, 1)
            $remainMin = [math]::Max(0, [math]::Round($MaxMinutes - $elapsedMin, 1))

            if ($path -eq "/download.rdp") {
              $rdpLines = @(
                "full address:s:$($Ip):$($RdpPort)",
                "username:s:$($User)",
                "prompt for credentials:i:1",
                "screen mode id:i:2",
                "session bpp:i:32",
                "audiomode:i:0",
                "redirectclipboard:i:1",
                "authentication level:i:2",
                "enablecredsspsupport:i:1"
              )
              $rdpContent = $rdpLines -join [Environment]::NewLine
              $buf = [System.Text.Encoding]::UTF8.GetBytes($rdpContent)
              $res.ContentType = "application/x-rdp"
              $res.AddHeader("Content-Disposition", "attachment; filename=AHMAD-DRAGON-$Ip.rdp")
              $res.OutputStream.Write($buf, 0, $buf.Length)
              $res.Close()
              continue
            }

            if ($path -eq "/api/status") {
              $osInfo = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
              $cpuLoad = (Get-CimInstance Win32_Processor -ErrorAction SilentlyContinue | Measure-Object -Property LoadPercentage -Average).Average
              $ramUsedPct = if ($osInfo) { [math]::Round((($osInfo.TotalVisibleMemorySize - $osInfo.FreePhysicalMemory) / $osInfo.TotalVisibleMemorySize) * 100, 1) } else { 24 }
              $disk = Get-CimInstance Win32_LogicalDisk -Filter "DeviceID='C:'" -ErrorAction SilentlyContinue
              $diskFree = if ($disk) { [math]::Round($disk.FreeSpace / 1GB, 1) } else { 110 }

              $payload = @{
                ip = $Ip; rdpPort = $RdpPort; username = $User; password = $currentPass;
                os = $OsLabel; cpuPercent = [int]$cpuLoad; ramPercent = $ramUsedPct;
                diskFreeGb = $diskFree; elapsedMinutes = $elapsedMin; remainingMinutes = $remainMin
              } | ConvertTo-Json
              $buf = [System.Text.Encoding]::UTF8.GetBytes($payload)
              $res.ContentType = "application/json; charset=utf-8"
              $res.OutputStream.Write($buf, 0, $buf.Length)
              $res.Close()
              continue
            }

            if ($path -eq "/api/action") {
              $cmd = $req.QueryString["cmd"]
              $msg = "Action executed"
              if ($cmd -eq "restart-rdp") {
                Restart-Service TermService -Force -ErrorAction SilentlyContinue
                $msg = "TermService (RDP) restarted successfully"
              } elseif ($cmd -eq "rotate-pass") {
                $newP = "Drg#" + [guid]::NewGuid().ToString("N").Substring(0, 10) + "!9A"
                $sec = ConvertTo-SecureString $newP -AsPlainText -Force
                Set-LocalUser -Name $User -Password $sec -ErrorAction SilentlyContinue
                Set-Content -Path $passFile -Value $newP -Encoding UTF8
                $msg = "Password rotated to: $newP"
              } elseif ($cmd -eq "flush-ram") {
                ipconfig /flushdns | Out-Null
                [System.GC]::Collect()
                $msg = "DNS Cache & Standby Memory flushed"
              } elseif ($cmd -eq "stop-server") {
                Set-Content -Path $stopFlag -Value "STOP"
                $msg = "Shutdown signal sent! Runner will terminate within 10 seconds."
              }
              $payload = @{ ok = $true; message = $msg; password = (Get-Content $passFile -Raw).Trim() } | ConvertTo-Json
              $buf = [System.Text.Encoding]::UTF8.GetBytes($payload)
              $res.ContentType = "application/json; charset=utf-8"
              $res.OutputStream.Write($buf, 0, $buf.Length)
              $res.Close()
              continue
            }

            $html = @"
          <!DOCTYPE html>
          <html lang="ar" dir="rtl">
          <head>
            <meta charset="utf-8" />
            <title>AHMAD DRAGON // RDP Live Control Panel</title>
            <style>
              body { background:#08090C; color:#F3F4F6; font-family:system-ui,sans-serif; margin:0; padding:24px; }
              .wrap { max-width:960px; margin:0 auto; }
              .hdr { border:1px solid #262936; background:#101218; padding:20px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-right:4px solid #F43F5E; }
              .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; margin-bottom:20px; }
              .card { background:#101218; border:1px solid #262936; padding:16px; border-radius:8px; }
              .lbl { color:#9CA3AF; font-size:12px; margin-bottom:6px; }
              .val { font-family:monospace; font-size:20px; font-weight:700; color:#10B981; direction:ltr; text-align:left; }
              .btns { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
              button, a.btn { background:#F43F5E; color:#fff; border:none; padding:10px 16px; border-radius:6px; cursor:pointer; font-weight:700; text-decoration:none; font-size:13px; }
              button.sec { background:#181B24; border:1px solid #262936; color:#F3F4F6; }
            </style>
          </head>
          <body>
            <div class="wrap">
              <div class="hdr">
                <div>
                  <h2 style="margin:0;color:#F43F5E">AHMAD DRAGON // لوحة تحكم السيرفر المباشرة</h2>
                  <p style="margin:4px 0 0;color:#9CA3AF;font-size:13px">نظام التشغيل: $OsLabel | متصل عبر Tailscale</p>
                </div>
                <a class="btn" href="/download.rdp">تحميل ملف الاتصال السريع (.RDP)</a>
              </div>
              <div class="grid">
                <div class="card"><div class="lbl">عنوان IP (Tailscale)</div><div class="val" id="ip">$Ip:$RdpPort</div></div>
                <div class="card"><div class="lbl">اسم المستخدم</div><div class="val" id="usr">$User</div></div>
                <div class="card"><div class="lbl">كلمة المرور الحالية</div><div class="val" id="pwd">$currentPass</div></div>
                <div class="card"><div class="lbl">الوقت المتبقي</div><div class="val" id="rem">$remainMin دقيقة</div></div>
              </div>
              <div class="card">
                <div class="lbl">أوامر التحكم السريع بالسيرفر عن بُعد</div>
                <div class="btns">
                  <button onclick="act('restart-rdp')">إعادة تشغيل خدمة RDP</button>
                  <button class="sec" onclick="act('rotate-pass')">توليد كلمة مرور جديدة فوراً</button>
                  <button class="sec" onclick="act('flush-ram')">تنظيف الرام و DNS</button>
                  <button class="sec" style="border-color:#EF4444;color:#EF4444" onclick="act('stop-server')">إيقاف السيرفر وإنهاء الجلسة</button>
                </div>
                <p id="msg" style="font-family:monospace;color:#F59E0B;margin-top:12px;font-size:13px"></p>
              </div>
            </div>
            <script>
              async function act(c){
                const r = await fetch('/api/action?cmd='+c);
                const d = await r.json();
                document.getElementById('msg').innerText = d.message;
                if(d.password) document.getElementById('pwd').innerText = d.password;
              }
            </script>
          </body>
          </html>
          "@
            $buf = [System.Text.Encoding]::UTF8.GetBytes($html)
            $res.ContentType = "text/html; charset=utf-8"
            $res.OutputStream.Write($buf, 0, $buf.Length)
            $res.Close()
          }
          '@

          $scriptPath = Join-Path ([System.IO.Path]::GetTempPath()) "dragon-web-panel.ps1"
          Set-Content -Path $scriptPath -Value $webScript -Encoding UTF8

          if ($IsWindows) {
            Start-Process pwsh -ArgumentList "-NoProfile -ExecutionPolicy Bypass -File `"$scriptPath`" -Port $env:DRAGON_WEB_PORT -Ip $env:TAILSCALE_IP -User $env:DRAGON_USER -Pass `"$env:DRAGON_PASS`" -RdpPort $env:DRAGON_RDP_PORT -OsLabel `"${{ inputs.os_version || 'windows-2025' }}`" -MaxMinutes ${{ inputs.session_minutes || '350' }}" -WindowStyle Hidden
            Write-Host "[OK] AHMAD DRAGON Web Control Panel running at: http://$($env:TAILSCALE_IP):$($env:DRAGON_WEB_PORT)" -ForegroundColor Green
          }

      # =========================================================================
      # 6. VERIFY RDP LISTENER & PUBLISH GITHUB STEP SUMMARY DASHBOARD
      # =========================================================================
      - name: 6. Verify RDP Port & Generate Connection Dashboard
        shell: pwsh
        run: |
          if ($IsWindows) {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              $listener = Get-NetTCPConnection -LocalPort 3389 -State Listen -ErrorAction SilentlyContinue
              if ($listener) { $ready = $true; break }
              Start-Sleep -Seconds 2
            }
            if (-not $ready) { throw "RDP Port 3389 is not listening!" }
          }

          $telemetry = Get-Content $env:DRAGON_TELEMETRY_FILE -Raw | ConvertFrom-Json

          Write-Host ""
          Write-Host "╔══════════════════════════════════════════════════════════════════╗" -ForegroundColor Red
          Write-Host "║               AHMAD DRAGON RDP SERVER IS ONLINE!                 ║" -ForegroundColor Red
          Write-Host "╠══════════════════════════════════════════════════════════════════╣" -ForegroundColor Red
          Write-Host "║ OS Edition     : $($telemetry.OSCaption)"
          Write-Host "║ Tailscale IP   : $($env:TAILSCALE_IP):$($env:DRAGON_RDP_PORT)"
          Write-Host "║ Web Dashboard  : http://$($env:TAILSCALE_IP):$($env:DRAGON_WEB_PORT)"
          Write-Host "║ Username       : $($env:DRAGON_USER)"
          Write-Host "║ Password       : $($env:DRAGON_PASS) ($($env:DRAGON_PASS_SOURCE))"
          Write-Host "║ CPU & RAM      : $($telemetry.CPUName) | $($telemetry.RAMTotalGB) GB RAM"
          Write-Host "╚══════════════════════════════════════════════════════════════════╝" -ForegroundColor Red

          # Write Markdown Card to GitHub Step Summary for instant browser visibility
          $summary = @"
          ## 🐉 AHMAD DRAGON // RDP Server Active & Ready
          | Parameter | Connection Value |
          | :--- | :--- |
          | **Operating System** | `$($telemetry.OSCaption) (Build $($telemetry.OSBuild))` |
          | **RDP Address (Tailscale)** | `$($env:TAILSCALE_IP):$($env:DRAGON_RDP_PORT)` |
          | **Live Web Control Panel** | **http://$($env:TAILSCALE_IP):$($env:DRAGON_WEB_PORT)** |
          | **Administrator Username** | `$($env:DRAGON_USER)` |
          | **Password (`$($env:DRAGON_PASS_SOURCE)`)** | `$($env:DRAGON_PASS)` |
          | **Processor & Cores** | `$($telemetry.CPUName) ($($telemetry.CPUCores) vCPUs)` |
          | **Memory & NVMe Storage** | `$($telemetry.RAMTotalGB) GB RAM | $($telemetry.DiskFreeGB) GB Free SSD` |
          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding UTF8 -Append

      # =========================================================================
      # 7. SMART KEEP-ALIVE HEARTBEAT WITH LIVE TELEMETRY & WEB STOP SIGNAL
      # =========================================================================
      - name: 7. Keep Server Alive & Stream Telemetry
        shell: pwsh
        run: |
          $maxMinutes = [int]"${{ inputs.session_minutes || '350' }}"
          $stopSignal = Join-Path ([System.IO.Path]::GetTempPath()) "dragon-stop.signal"
          $passFile = Join-Path ([System.IO.Path]::GetTempPath()) "dragon-current-pass.txt"
          $start = Get-Date

          Write-Host "[+] Server Keep-Alive Loop Active for $maxMinutes minutes..." -ForegroundColor Cyan
          Write-Host "[+] Open http://$($env:TAILSCALE_IP):$($env:DRAGON_WEB_PORT) in your browser to control the server." -ForegroundColor Green

          while (((Get-Date) - $start).TotalMinutes -lt $maxMinutes) {
            if (Test-Path $stopSignal) {
              Write-Host "[!] Shutdown signal received from AHMAD DRAGON Web Control Panel. Stopping gracefully..." -ForegroundColor Yellow
              break
            }

            $elapsed = [math]::Round(((Get-Date) - $start).TotalMinutes, 1)
            $remaining = [math]::Round($maxMinutes - $elapsed, 1)
            $activePass = if (Test-Path $passFile) { (Get-Content $passFile -Raw).Trim() } else { $env:DRAGON_PASS }

            Write-Host "[DRAGON HEARTBEAT $(Get-Date -Format 'HH:mm:ss')] IP: $($env:TAILSCALE_IP):$($env:DRAGON_RDP_PORT) | WebUI: http://$($env:TAILSCALE_IP):$($env:DRAGON_WEB_PORT) | User: $($env:DRAGON_USER) | Pass: $activePass | Remaining: $remaining min"
            Start-Sleep -Seconds 60
          }
